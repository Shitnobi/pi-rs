[workspace]
resolver = "2"
members = ["crates/pi-core", "crates/pi-tools",
    "crates/pi-providers", "crates/pi-cli", "crates/pi-photon", "crates/pi-tui",
    "crates/pi-agent", "crates/pi-session", "crates/pi-extensions"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/earendil-works/pi-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
unicode-normalization = "0.1"
fancy-regex = "0.19"
