[workspace]
resolver = "2"
members = ["crates/pi-core", "crates/pi-tools", "crates/pi-cli", "crates/pi-photon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/earendil-works/pi-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
