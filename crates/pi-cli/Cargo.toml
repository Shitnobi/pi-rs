[package]
name = "pi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for the Rust port of the pi coding agent, plus the parity-test harness"

[[bin]]
name = "pi-cli"
path = "src/main.rs"

[dependencies]
pi-core = { path = "../pi-core" }
pi-providers = { path = "../pi-providers" }
pi-session = { path = "../pi-session" }
pi-tools = { path = "../pi-tools" }
pi-tui = { path = "../pi-tui" }
serde = { workspace = true }
serde_json = { workspace = true }
